  .sticky-cta {

<!-- Widget oficial de checkout da Hotmart: abre o pagamento em um overlay
     na própria página (em vez de sair pro site da Hotmart), e já integra
     com o Pixel do Meta quando ele estiver instalado na página. Só precisa
     desse bloco uma vez — os 11 elementos clicáveis (as 10 imagens inteiras
     + a barra fixa) usam o mesmo link, já que todos têm a classe
     "hotmart-fb hotmart__button-checkout". -->
<script type="text/javascript">
	function importHotmart(){
 		var imported = document.createElement('script');
 		imported.src = 'https://static.hotmart.com/checkout/widget.min.js';
 		document.head.appendChild(imported);
		var link = document.createElement('link');
		link.rel = 'stylesheet';
		link.type = 'text/css';
		link.href = 'https://static.hotmart.com/css/hotmart-fb.min.css';
		document.head.appendChild(link);	}
 	importHotmart();
</script>

<script>
  // Meta Pixel já instalado no <head> (ID 1323893266191840).
  // Dispara o evento de clique no CTA pro Pixel.
  document.querySelectorAll('[data-cta]').forEach(function (el) {
    el.addEventListener('click', function () {
      if (window.fbq) fbq('track', 'InitiateCheckout');
    });
  });

  // Reserva, no fim da página, o espaço exato da altura da barra fixa —
  // sem isso ela fica sobreposta por cima do final da última imagem
  // (que já tem o botão real "QUERO COMEÇAR AGORA" desenhado nela).
  // Recalcula no load e no resize, porque em telas estreitas o texto da
  // barra pode quebrar em 2 linhas e mudar de altura.
  function ajustarEspacoBarraFixa() {
    var barra = document.getElementById('sticky-cta');
    var container = document.getElementById('lp-container');
    if (barra && container) {
      container.style.paddingBottom = barra.offsetHeight + 'px';
    }
  }
  window.addEventListener('load', ajustarEspacoBarraFixa);
  window.addEventListener('resize', ajustarEspacoBarraFixa);
</script>
